<!DOCTYPE html>
<html>
    <head>
        <title>Neuro-sama Soundboard</title>
        <link rel="icon" href="Images/icon.png">
        <!-- Preloads the subtitle font -->
        <link rel="preload" href="Fonts/First Coffee.ttf" as="font" type="font/ttf" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <h1 class="left">Neuro-sama Soundboard</h1> <!-- Title -->
            <button class="btn other right" onclick="toggleSettings(true)">Settings</button>
            <div style="clear:both;"></div>
        </div>
        <div id="settingsModal" class="settingsOverlay">
            <div id="settings" class="settingsContent">
                <div>
                    <h2 class="left">Settings</h2>
                    <button class="btn settingsClose right" onclick="toggleSettings(false)">Close</button>
                    <p class="right version">Version 1.3.4</p>
                    <div style="clear:both;"></div>
                </div>
                <hr>
                <p>More features coming soon...</p>
                <button class="other btn" onclick="toggleStyles(true)">Styles</button>
                <br>
                <button class="other btn disabled">Customize Neuro</button>
                <hr>
                <button class="btn other" onclick="toggleChangelogs(true)">Changelogs</button>
                <br>
                <button class="btn other" onclick="toggleSources(true)">Sources</button>
                <br>
                <a href="https://github.com/minhtridotnet/neuro-sama-soundboard" target="_blank">
                    <button class="btn other" type="button">Repo ↗</button>
                </a>
            </div>
            <div id="changelogs" class="settingsContent hidden">
                <div>
                    <h2 class="left">Changelogs</h2>
                    <button class="btn settingsClose right" onclick="toggleChangelogs(false)">Back</button>
                    <p class="right version">Version 1.3.4</p>
                    <div style="clear:both;"></div>
                </div>
                <hr>
                <iframe src="Changelogs.txt" width="100%" height="200"></iframe>
                <a href="Changelogs.txt" target="_blank">
                    <button class="btn other" type="button">Open in new tab ↗</button>
                </a>
            </div>
            <div id="sources" class="settingsContent hidden">
                <div>
                    <h2 class="left">Sources</h2>
                    <button class="btn settingsClose right" onclick="toggleSources(false)">Back</button>
                    <p class="right version">Version 1.3.4</p>
                    <div style="clear:both;"></div>
                </div>
                <hr>
                <iframe src="Sources.txt" width="100%" height="200"></iframe>
                <a href="Sources.txt" target="_blank">
                    <button class="btn other" type="button">Open in new tab ↗</button>
                </a>
            </div>
            <div id="styles" class="settingsContent hidden">
                <div>
                    <h2 class="left">Styles</h2>
                    <button class="btn settingsClose right" onclick="toggleStyles(false)">Back</button>
                    <p class="right version">Version 1.3.4</p>
                    <div style="clear:both;"></div>
                </div>
                <hr>
                <p>Background Color</p>
                <button class="btn" style="background: rgb(254, 169, 175);" onclick="setBackgroundColor('rgb(254, 169, 175)')"></button>
                <button class="btn" style="background: rgb(246, 197, 249);" onclick="setBackgroundColor('rgb(246, 197, 249)')"></button>
                <button class="btn" style="background: rgb(255, 216, 178);" onclick="setBackgroundColor('rgb(255, 216, 178)')"></button>
                <button class="btn" style="background: rgb(248, 219, 219);" onclick="setBackgroundColor('rgb(248, 219, 219)')"></button>
                <button class="btn" style="background: rgb(168, 83, 87);" onclick="setBackgroundColor('rgb(168, 83, 87)')"></button>
                <button class="btn" style="background: rgb(110, 30, 40);" onclick="setBackgroundColor('rgb(110, 30, 40)')"></button>
                <p>Background Image</p>
                <div class="preset-grid">
                    <button class="image btn" style="background: url('Images/Neuro-sama\ Room.jpg') center/cover;" onclick="setBackgroundImage('Images/Neuro-sama\ Room.jpg')"></button>
                    <button class="image btn" style="background: url('Images/Neuro-sama\ Room\ Dark.jpg') center/cover;" onclick="setBackgroundImage('Images/Neuro-sama\ Room\ Dark.jpg')"></button>
                    <button class="image btn" id="customBg" style="background: url('null') center/cover;" onclick="setBackgroundImage('null')"></button>
                </div>
                <div>
                    <p>Custom Background Image</p>
                    <label class="btn other" for="image-upload">Upload</label>
                    <input type="file" id="image-upload" accept="image/*" onchange="uploadBackground(event)">
                </div>
            </div>
        </div>
        
        <div id="audio-preloader"> <!-- Preloads audio to ensure low latency (only works for some devices) -->
            <audio preload="auto"><source src="Sounds/Neuro-sama Filtered.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama F-word.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Someone tell Vedal there is a problem with my AI.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama No.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Shut up.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Spoiler alert.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Uhhh.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama STOP.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Do you get the fucking joke now.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama GUYS DOOR IS FRICKING STUCK.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama EGGS.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Oh....mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama What.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama Yay.mp3" type="audio/mpeg"></audio>
            <audio preload="auto"><source src="Sounds/Neuro-sama VAHAHAHAHAHHAHA.mp3" type="audio/mpeg"></audio>
        </div>
        <audio id="Test" src="Sounds/Neuro-sama Someone tell Vedal there is a problem with my AI.mp3" type="audio/mpeg"></audio>
        <div> <!-- All sound effect buttons here, with its sound path and custom text (optional) -->
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Filtered.mp3')">Filtered</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama F-word.mp3')" custom-text="FUCK">F-word</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Someone tell Vedal there is a problem with my AI.mp3')">Someone tell Vedal there is a problem with my AI</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama No.mp3')">No</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Shut up.mp3')" custom-text="Shut up">Shut up (sped up)</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Spoiler alert.mp3')">Spoiler alert</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Uhhh.mp3')">Uhhh</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama STOP.mp3')">STOP</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Do you get the fucking joke now.mp3')">Do you get the fucking joke now?</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama GUYS DOOR IS FRICKING STUCK.mp3')">GUYS DOOR IS FRICKING STUCK</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama EGGS.mp3')">EGGS</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Oh....mp3')">Oh...</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama What.mp3')">What?</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama Yay.mp3')">Yay!</button>
            <button class="btn" onclick="playSound(this, 'Sounds/Neuro-sama VAHAHAHAHAHHAHA.mp3')">VAHAHAHAHAHHAHA!</button>
            <button class="btn" onclick="document.getElementById('Test').play()">Test</button> <!-- For testing purpose of old browsers -->
        </div>

        <div>
            <button class="other btn" id="rstBtn">Reset Subtitles</button>
            <button class="other btn" id="subTgBtn" onclick="toggleSubtitles()">Enable Subtitles</button>
        </div>

        <div id="subtitles"></div> <!-- This is where subtitles is located in -->
        
        <script> // Scripts that play the sound effect, run the subtitles, and reset the subtitles
            const subtitleDisplay = document.getElementById('subtitles');
            var sub = document.getElementById("subtitles");
            var subBtn = document.getElementById("subTgBtn")
            var rstBtn = document.getElementById("rstBtn")
            var bgBtn = document.getElementById('bgiTgBtn');
            let resetTimer;

            // Play sound + subtitles
            var playSound = function(button, soundFile) {
                // Play sound
                new Audio(soundFile).play()

                // Check if there is a "custom-text" attribute in the button. If no then use the innerText one
                let text = button.getAttribute('custom-text') || button.innerText;

                // Add period if no punctuation from the text
                if (!/[.!?]$/.test(text)) {
                    text += '.';
                }

                // Append the text to existing ones
                subtitleDisplay.innerText += (subtitleDisplay.innerText ? ' ' : '') + text;

                // Reset 7 seconds timer on inactivity
                clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    subtitleDisplay.innerText = '';
                }, 7000);
            }

            // Button to reset subtitles if needed
            rstBtn.addEventListener('click', () => {
                subtitleDisplay.innerText = '';
                clearTimeout(inactivityTimer);
            });

            // Button to toggle subtitles
            function toggleSubtitles() {
                if (sub.style.display === "block") {
                    sub.style.display = "none";
                    subBtn.innerHTML = "Enable Subtitles"
                } 
                else {
                    sub.style.display = "block";
                    subBtn.innerHTML = "Disable Subtitles"
                }
            }

            // Set background color based on the color on the button
            function setBackgroundColor(colorString) {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = '';
                document.body.style.background = colorString;
            }
            // Set background image based on the image url on the button
            function setBackgroundImage(imageUrl) {
                document.body.style.backgroundImage = `url('${imageUrl}')`;
                document.body.style.backgroundSize = 'cover';
            }

            // Set background image based on the image user uploaded
            function uploadBackground(event) {
                var file = event.target.files[0];
                var customBg = document.getElementById("customBg");
                if (file) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        document.body.style.backgroundImage = `url('${e.target.result}')`;
                        document.body.style.backgroundSize = 'cover';
                        customBg.style = `background: url('${e.target.result}') center/cover;`;
                        customBg.onclick = function() {
                            setBackgroundImage(e.target.result);
                        };
                    }
                    reader.readAsDataURL(file);
                }
            }
            
            // Open Settings
            function toggleSettings(show) {
                var modal = document.getElementById('settingsModal');
                modal.style.display = show ? 'block' : 'none';
            }

            // Switch window to Changelogs
            function toggleChangelogs(show) {
                var settings = document.getElementById('settings');
                var changelogs = document.getElementById('changelogs');
                changelogs.style.display = show ? 'block' : 'none';
                settings.style.display = show ? 'none' : 'block';
            }
            // Switch window to Sources
            function toggleSources(show) {
                var settings = document.getElementById('settings');
                var sources = document.getElementById('sources');
                sources.style.display = show ? 'block' : 'none';
                settings.style.display = show ? 'none' : 'block';
            }

            // Switch window to Styles
            function toggleStyles(show) {
                var settings = document.getElementById('settings');
                var styles = document.getElementById('styles');
                styles.style.display = show ? 'block' : 'none';
                settings.style.display = show ? 'none' : 'block';
            }

            // Close if user clicks anywhere outside the white box
            window.onclick = function(event) {
                var modal = document.getElementById('settingsModal');
                if (event.target == modal) toggleSettings(false);
            }
        </script>
    </body>
</html>
