        <div> <!-- All sound effect buttons here, with its sound path and custom text (optional) -->
            <button class="btn" id="sfx" sound="Sounds/Neuro-sama Filtered.mp3" type="button">Filtered</button>
            <button class="btn" id="sfx" sound="Sounds/Neuro-sama F-word.mp3" custom-text="FUCK">F-word</button>

            <button class="btn" id="sfx" sound="Sounds/Neuro-sama No.mp3">No</button>
            <button class="btn" id="sfx" sound="Sounds/Neuro-sama Shut up.mp3" custom-text="Shut up">Shut up (sped up)</button>
            <button class="btn" id="sfx" sound="Sounds/Neuro-sama Spoiler alert.mp3">Spoiler alert</button>
            <button class="btn" id="sfx" sound="Sounds/Neuro-sama Uhhh.mp3">Uhhh</button>

            <button class="btn" id="sfx" sound="Sounds/Neuro-sama Yay.mp3">Yay!</button>

        </div>

        <div>
            <button class="other btn" id="rstBtn">Reset Subtitles</button>
            <button class="other btn" id="subTgBtn" onclick="toggleSubtitles()">Enable Subtitles</button>
            <button class="other btn" id="bgiTgBtn">Switch Background</button>
        </div>

        <div id="subtitles"></div> <!-- This is where subtitles is located in -->
        
        <script> // Scripts that play the sound effect, run the subtitles, and reset the subtitles
            const subtitleDisplay = document.getElementById('subtitles');
            const buttons = document.querySelectorAll('#sfx');
            var sub = document.getElementById("subtitles");
            var subBtn = document.getElementById("subTgBtn")
            var rstBtn = document.getElementById("rstBtn")
            var bgBtn = document.getElementById('bgiTgBtn');
            let resetTimer;

            // Check if broswer is old (pre-ES6)
            function isBrowserOld() {
                // try {
                //     new Function("() => {}");
                //     return !window.fetch || !window.Promise;
                // }
                // catch (e) {
                //     return true;
                // }
                if (!window.getComputedStyle) {
                    return true;
                }
            }

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    if (isBrowserOld()) {
                        // Experimental: Play sound for old browsers (not tested)
                        var soundPath = button.getAttribute('sound');
                        var sound = document.createElement('bgsound');
                        sound.src = soundPath;
                        sound.autostart = 'true';
                        sound.loop = 'false';
                        document.body.appendChild(sound);
                    }
                    else {
                        // Play sound using the "sound" attribute in the button
                        const soundPath = button.getAttribute('sound');
                        new Audio(soundPath).play();

                        // Check if there is a "custom-text" attribute in the button. If no then use the innerText one
                        let text = button.getAttribute('custom-text') || button.innerText;

                        // Add period if no punctuation from the text
                        if (!/[.!?]$/.test(text)) {
                            text += '.';
                        }

                        // Append the text to existing ones
                        subtitleDisplay.innerText += (subtitleDisplay.innerText ? ' ' : '') + text;

                        // Reset 7 seconds timer on inactivity
                        clearTimeout(resetTimer);
                        resetTimer = setTimeout(() => {
                            subtitleDisplay.innerText = '';
                        }, 7000);
                    }
                });
            });

            if (isBrowserOld()) {
                // Hide nonworking buttons for old browsers
                sub.style.display = "none"
                subBtn.style.display = "none";
                bgBtn.style.display = "none";
                rstBtn.style.display = "none";
            }
            else {
                // Button to reset subtitles if needed
                rstBtn.addEventListener('click', () => {
                    subtitleDisplay.innerText = '';
                    clearTimeout(inactivityTimer);
                });

                // Button to toggle subtitles
                function toggleSubtitles() {
                if (sub.style.display === "block") {
                    sub.style.display = "none";
                    subBtn.innerHTML = "Enable Subtitles"
                } else {
                    sub.style.display = "block";
                    subBtn.innerHTML = "Disable Subtitles"
                }
                }

                // Background switcher
                const images = [
                null, // No background - Solid color
                'Images/Neuro-sama\ Room.jpg',
                'Images/Neuro-sama\ Room\ Dark.jpg',
                ];

                let currentIndex = 0;

                bgBtn.addEventListener('click', function() {
                    // Increment index and loop back to 0 if at the end
                    currentIndex = (currentIndex + 1) % images.length;
                    
                    // Apply new image to the body background
                    document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
                });
            }
        </script>
    </body>
